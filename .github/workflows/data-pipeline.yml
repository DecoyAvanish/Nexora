name: Nexora data pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 2-6"
    - cron: "*/30 14-21 * * 1-5"
jobs:
  scheduled-ingestion:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: Nexora research ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run observable ingestion jobs
        run: |
          python -m backend.pipeline_jobs daily_price_ingestion
          python -m backend.pipeline_jobs intraday_quote_updates
          python -m backend.pipeline_jobs news_collection
          python -m backend.pipeline_jobs sec_filing_ingestion
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-observability-${{ github.run_number }}
          path: data/pipeline.db
